    <main>

        <!-- BOTÓN ACCESIBILIDAD -->
        <button id="btnAccesibilidad" class="BotonAccessibilidad" data-i18n-title="Accesibilidad.Titulo"
            data-i18n-aria-label="Accesibilidad.Titulo">

            <i class="fa-solid fa-universal-access" aria-hidden="true"></i>
        </button>

        <div id="menuAccesibilidad" class="PanelMenuAccesibilidad">

            <div class="MenuAccesEncabezado">
                <span data-i18n="Acces.Titulo"></span>
                <button id="cerrarAcc" data-i18n-aria-label="Acces.Cerrar">&times;</button>
            </div>

            <div class="MenuAccesCuerpo">

                <div class="MenuGrupoAcces">
                    <small data-i18n="Acces.Texto.Tamano"></small>

                    <div class="MenuAccesFilaBotones">
                        <button class="MenuAccesOpcion" onclick="cambiarTamano(0.1)">
                            <i class="fa-solid fa-plus"></i>
                            <span data-i18n="Acces.Botones.Aumentar"></span>
                        </button>

                        <button class="MenuAccesOpcion" onclick="cambiarTamano(-0.1)">
                            <i class="fa-solid fa-minus"></i>
                            <span data-i18n="Acces.Botones.Reducir"></span>
                        </button>
                    </div>
                </div>


                <div class="MenuGrupoAcces">
                    <small data-i18n="Acces.Texto.Visual"></small>

                    <button class="MenuAccesOpcion" onclick="alternarClase('modo-contraste')">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                        <span data-i18n="Acces.Botones.Contraste"></span>
                    </button>

                    <button class="MenuAccesOpcion" onclick="alternarClase('resaltar-enlaces')">
                        <i class="fa-solid fa-link"></i>
                        <span data-i18n="Acces.Botones.Enlaces"></span>
                    </button>
                </div>


                <div class="MenuGrupoAcces">
                    <small data-i18n="Acces.Texto.Lectura"></small>

                    <button class="MenuAccesOpcion" onclick="alternarClase('fuente-legible')">
                        <i class="fa-solid fa-font"></i>
                        <span data-i18n="Acces.Botones.Fuente"></span>
                    </button>

                    <button class="MenuAccesOpcion" onclick="alternarClase('cursor-grande')">
                        <i class="fa-solid fa-arrow-pointer"></i>
                        <span data-i18n="Acces.Botones.Cursor"></span>
                    </button>

                    <button class="MenuAccesOpcion" onclick="alternarClase('sin-animaciones')">
                        <i class="fa-solid fa-clapperboard"></i>
                        <span data-i18n="Acces.Botones.Animaciones"></span>
                    </button>
                </div>

                <hr>

                <button class="MenuAccesOpcion BotonReiniciar" onclick="restablecerTodo()">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span data-i18n="Acces.Botones.Reset"></span>
                </button>

            </div>
        </div>
