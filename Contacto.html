                </div>


                <div class="MenuGrupoAcces">

                    </button>
                </div>

        <!--====== CONTACTO  ======-->
        <section id="Contacto" class="ScContenedor" style="background-color: #f4f4f4;"
            aria-labelledby="titulo-contacto">

            <div class="Contenedor">

                <div class="Titulo">
                    <h2 id="titulo-contacto" data-i18n="ContactoPage.Titulo"></h2>
                </div>

                <div class="Descripcion">
                    <p data-i18n="ContactoPage.Descripcion"></p>
                </div>

                <div class="Contenedor" style="padding: 15px 0px 0px 0px;">
                    <div class="FilaContacto">

                        <!-- INFO -->
                        <div class="ColContacto">
                            <div class="InfoContacto">

                                <a href="mailto:info@visitsuiza.com" data-i18n="ContactoPage.Info.Email"
                                    data-i18n-aria-label="ContactoPage.Info.EmailAria"></a>

                                <a href="tel:+41000000000" data-i18n="ContactoPage.Info.Telefono"
                                    data-i18n-aria-label="ContactoPage.Info.TelefonoAria"></a>

                                <span data-i18n="ContactoPage.Info.Horario"></span>

                                <span style="border:1.5px solid black; border-radius: 10%; margin: 5% 0;"
                                    aria-hidden="true"></span>

                                <div class="RedesContacto">
                                    <a href="https://facebook.com" data-i18n-aria-label="ContactoPage.Redes.Facebook">
                                        <i class="fa-brands fa-facebook"></i>
                                    </a>
                                    <a href="https://instagram.com" data-i18n-aria-label="ContactoPage.Redes.Instagram">
                                        <i class="fa-brands fa-square-instagram"></i>
                                    </a>
                                    <a href="https://youtube.com" data-i18n-aria-label="ContactoPage.Redes.Youtube">
                                        <i class="fa-brands fa-youtube"></i>
                                    </a>
                                </div>

                            </div>
                        </div>

                        <!-- FORM -->
                        <div class="ColContacto w75c SeparadorVertical">
                            <div class="ConFormularioContacto">

                                <form id="FormularioContacto">

                                    <div class="Campo">
                                        <label for="nombre_contacto">
                                            <span data-i18n="ContactoPage.Form.Nombre"></span>
                                            <span class="required" aria-hidden="true">*</span>
                                        </label>
                                        <input type="text" id="nombre_contacto"
                                            data-i18n-placeholder="ContactoPage.Form.NombrePH" required>
                                    </div>

                                    <div class="Campo">
                                        <label for="apellido_contacto">
                                            <span data-i18n="ContactoPage.Form.Apellido"></span>
                                            <span class="required" aria-hidden="true">*</span>
                                        </label>
                                        <input type="text" id="apellido_contacto"
                                            data-i18n-placeholder="ContactoPage.Form.ApellidoPH" required>
                                    </div>

                                    <div class="Campo">
                                        <label for="correo_contacto">
                                            <span data-i18n="ContactoPage.Form.Correo"></span>
                                            <span class="required" aria-hidden="true">*</span>
                                        </label>
                                        <input type="email" id="correo_contacto"
                                            data-i18n-placeholder="ContactoPage.Form.CorreoPH" required>
                                    </div>

                                    <fieldset>
                                        <legend data-i18n="ContactoPage.Form.Tipo"></legend>

                                        <div class="OpcionesRadio">

                                            <label>
                                                <input type="checkbox">
                                                <span data-i18n="ContactoPage.Form.Opciones.Soporte"></span>
                                            </label>

                                            <label>
                                                <input type="checkbox">
                                                <span data-i18n="ContactoPage.Form.Opciones.Info"></span>
                                            </label>

                                            <label>
                                                <input type="checkbox">
                                                <span data-i18n="ContactoPage.Form.Opciones.Plan"></span>
                                            </label>

                                            <label>
                                                <input type="checkbox">
                                                <span data-i18n="ContactoPage.Form.Opciones.Alianzas"></span>
                                            </label>

                                            <label>
                                                <input type="checkbox">
                                                <span data-i18n="ContactoPage.Form.Opciones.Eventos"></span>
                                            </label>

                                        </div>
                                    </fieldset>

                                    <div class="Campo">
                                        <label for="mensaje_contacto" data-i18n="ContactoPage.Form.Mensaje"></label>

                                        <textarea id="mensaje_contacto" rows="5"
                                            data-i18n-placeholder="ContactoPage.Form.MensajePH" required></textarea>
                                    </div>

                                    <button type="submit" class="BotonEnviar"
                                        data-i18n="ContactoPage.Form.Boton"></button>

                                </form>

                                <!-- MODAL -->
                                <div class="ModalContacto" id="ModalContacto" role="dialog" aria-modal="true"
                                    aria-labelledby="modal-contacto-titulo">

                                    <div class="ModalContactoBox">

                                        <button class="CerrarModalContacto" id="CerrarModalContacto"

                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <section id="Atencion" class="ScContenedor" aria-labelledby="titulo-atencion">

                <div class="MapaResponsive">

                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1398238.9288952476!2d6.902303823682438!3d46.80557824825584!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x478c64ef6f596d61%3A0x5c56b5110fcb7b15!2sSuiza!5e0!3m2!1ses!2sco!4v1772377173050!5m2!1ses!2sco"
                        allowfullscreen loading="lazy">
                    </iframe>
                </div>

            </div>
        </section>

    </main>
